services:
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - BACKEND=http://192.168.40.10:80
      - PARANOIA=1
    volumes:
      - ./rules/custom_rules.conf:/etc/modsecurity.d/owasp-crs/rules/custom_rules.conf
