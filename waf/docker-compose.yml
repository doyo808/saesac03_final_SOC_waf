version: '3.8'

services:
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - BACKEND=${BACKEND:-http://192.168.40.10:80}
      - PARANOIA=${PARANOIA:-2}
      - MODSEC_RULE_ENGINE=${MODSEC_RULE_ENGINE:-On}
      - MODSEC_AUDIT_ENGINE=RelevantOnly
      - MODSEC_RULE_REMOVE_BY_ID=920350
    volumes:
      # 1. Nginx 로그 설정
      - ./config/99-soc-json-log.conf:/etc/nginx/conf.d/99-soc-json-log.conf:ro

      # 2. [치트키] 메인 설정 파일이 우리 규칙을 읽도록 경로 강제 매핑
      # 이 경로는 엔진이 부팅 시 가장 먼저, 무조건 읽는 위치입니다.
      - ./rules/00_custom_rules.conf:/etc/modsecurity.d/modsecurity-override.conf:ro
