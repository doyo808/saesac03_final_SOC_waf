version: '3.8'

services:
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - BACKEND=${BACKEND:-http://192.168.40.10:80}
      - PARANOIA=${PARANOIA:-2}
      - MODSEC_RULE_ENGINE=${MODSEC_RULE_ENGINE:-On}
      - MODSEC_AUDIT_ENGINE=RelevantOnly
      - MODSEC_RULE_REMOVE_BY_ID=920350
    volumes:
      # 1. 로그 설정
      - ./config/99-soc-json-log.conf:/etc/nginx/conf.d/99-soc-json-log.conf:ro

      # 2. [가장 확실한 방법] rules 폴더 자체를 컨테이너의 rules 폴더로 마운트
      # 이렇게 하면 폴더 안의 00_custom_rules.conf를 엔진이 자동으로 스캔해서 읽습니다.
      - ./rules:/etc/modsecurity.d/owasp-crs/rules:ro
