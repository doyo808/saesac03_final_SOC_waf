version: '3.8'

services:
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - BACKEND=${BACKEND:-http://192.168.40.10:80}
      - PARANOIA=${PARANOIA:-2}
      - MODSEC_RULE_ENGINE=${MODSEC_RULE_ENGINE:-On}
      - MODSEC_AUDIT_ENGINE=RelevantOnly
      - MODSEC_RULE_REMOVE_BY_ID=920350
    volumes:
      # 1. Nginx 로그 설정
      - ./config/99-soc-json-log.conf:/etc/nginx/conf.d/99-soc-json-log.conf:ro

      # 2. [이것만 남기세요] BEFORE-CRS.conf라는 "이름"으로 우리 파일을 딱 한 번만 꽂아넣습니다.
      # 이렇게 하면 중복 에러 없이 CRS보다 먼저 실행됩니다.
      - ./rules/00_custom_rules.conf:/etc/modsecurity.d/owasp-crs/confs/BEFORE-CRS.conf:ro
