version: '3.8'

services:
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      # 백엔드 서버 IP (사용자 환경에 맞게 자동 설정됨)
      - BACKEND=${BACKEND:-http://192.168.40.10:80}
      # 탐지 민감도 설정 (2단계 권장)
      - PARANOIA=${PARANOIA:-2}
      # 탐지 모드 활성화
      - MODSEC_RULE_ENGINE=${MODSEC_RULE_ENGINE:-On}
      # 감사 로그 설정
      - MODSEC_AUDIT_ENGINE=RelevantOnly
      # [중요] 오타로 인한 과탐 방지: 920350 규칙을 로드 시점에 미리 제거
      - MODSEC_RULE_REMOVE_BY_ID=920350
    volumes:
      # 1. Nginx 전용 로그 설정 (SOC 분석용 JSON 로그)
      - ./config/99-soc-json-log.conf:/etc/nginx/conf.d/99-soc-json-log.conf:ro

      # 2. CRS 실행 전 예외 규칙 처리
      - ./rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/confs/BEFORE-CRS.conf:ro

      # 3. [미탐 해결의 핵심] 커스텀 규칙 우선순위 강제 적용
      # 로컬의 custom_rules.conf 파일을 컨테이너 내부에 '00_custom_rules.conf'로 매핑하여
      # 알파벳 순서상 숫자 '9'로 시작하는 CRS 규칙보다 먼저 읽히게 함
      - ./rules/custom_rules.conf:/etc/modsecurity.d/owasp-crs/rules/00_custom_rules.conf:ro
