version: '3.8'

services:
  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: waf
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      - BACKEND=${BACKEND:-http://192.168.40.10:80}
      - PARANOIA=${PARANOIA:-2}
      - MODSEC_RULE_ENGINE=${MODSEC_RULE_ENGINE:-On}
      - MODSEC_AUDIT_ENGINE=RelevantOnly
      - MODSEC_RULE_REMOVE_BY_ID=920350
    volumes:
      # 1. Nginx 로그 설정 (기존 유지)
      - ./config/99-soc-json-log.conf:/etc/nginx/conf.d/99-soc-json-log.conf:ro

      # 2. [핵심] 00_custom_rules.conf를 직접 규칙 폴더에 매핑
      # 목적지 경로(/etc/modsecurity.d/owasp-crs/rules/...)를 파일명까지 정확히 적어줘야 합니다.
      - ./rules/00_custom_rules.conf:/etc/modsecurity.d/owasp-crs/rules/00_custom_rules.conf:ro
