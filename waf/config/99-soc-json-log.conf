# 1. 오타 경로 판별 필터
map $request_uri $uri_loggable {
    ~*/lms/(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse) 0;
    default 1;
}

map $http_referer $ref_loggable {
    ~*/lms/(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse) 0;
    default 1;
}

map "$uri_loggable$ref_loggable" $final_loggable {
    "11"    1;
    default 0;
}

# 2. JSON 로그 포맷
log_format soc_json escape=json
'{"timestamp":"$time_iso8601","client_ip":"$remote_addr","forwarded_for":"$http_x_forwarded_for","request_id":"$http_x_request_id","request_method":"$request_method","request_uri":"$uri","query_string":"$args","status_code":$status,"bytes_sent":$bytes_sent,"request_time":"$request_time","user_agent":"$http_user_agent","referer":"$http_referer","host":"$host","request_line":"$request"}';

# 3. 모든 출력 채널에 필터 적용
access_log off; 
access_log /var/log/nginx/access.log soc_json if=$final_loggable;
access_log /dev/stdout soc_json if=$final_loggable;
