# ----------------------------------------------------------------
# Project-adapted ModSecurity rules for kj.ac.kr / www.kj.ac.kr
# False-positive tuning only
# Loaded before CRS via docker-compose as
# REQUEST-899-LOCAL-CUSTOM-BEFORE-CRS.conf.
# ----------------------------------------------------------------

# 🚨 [필수 추가] POST 본문(Request Body)을 로그에 남기기 위한 설정 (C 파트 포함)
SecAuditLogParts ABCEFHJKZ

# [Phase 1] Method exceptions kept for board CRUD
# ----------------------------------------------------------------

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990130,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/?$" \
        "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990131,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/comments/[0-9]+/?$" \
        "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990132,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq OPTIONS" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts(?:/[0-9]+(?:/comments/[0-9]+)?)?/?$" \
        "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} OPTIONS'"

# [Phase 1] Search-route false-positive tuning for CRS tags
# ----------------------------------------------------------------
# Scope:
# - GET /api/board/posts -> keyword, author
# - GET /api/public/announcements -> keyword
# Rationale:
# - The application treats these values as literal LIKE-search terms.
# - We intentionally remove CRS attack inspection from only these args
#   so educational or security-context searches are not blocked.
# - Academic events are not included because the current project does not
#   expose a search query for /api/public/academic-events.

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1000010,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/?$" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:author,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:author,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:author,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:author,\
        msg:'PROJECT_BOARD_SEARCH_FP_TUNING'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1000011,phase:1,pass,log,auditlog,chain,tag:'CAMPUS_WAF',tag:'EXCEPTION_RULE',tag:'ANN_SEARCH',msg:'APPLIED: PROJECT_ANNOUNCEMENT_SEARCH_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/public/announcements/?$" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:keyword"

# [Phase 1] Precise exemptions for custom deny rules added in this file
# ----------------------------------------------------------------
# Reason:
# - Added custom deny rules (3100xxx) increased false positives mainly on:
#   * GET /api/board/posts?keyword=...&author=...
#   * GET /api/public/announcements?keyword=...
# - We remove only those safe search parameters from only those custom rule IDs.
# - This keeps custom deny rules active elsewhere.

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1000012,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/?$" \
        "t:none,\
        ctl:ruleRemoveTargetById=3100001;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100002;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100003;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100004;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100011;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100012;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100013;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100021;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100022;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100031;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100032;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100033;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100051;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100001;ARGS:author,\
        ctl:ruleRemoveTargetById=3100002;ARGS:author,\
        ctl:ruleRemoveTargetById=3100003;ARGS:author,\
        ctl:ruleRemoveTargetById=3100004;ARGS:author,\
        ctl:ruleRemoveTargetById=3100011;ARGS:author,\
        ctl:ruleRemoveTargetById=3100012;ARGS:author,\
        ctl:ruleRemoveTargetById=3100013;ARGS:author,\
        ctl:ruleRemoveTargetById=3100021;ARGS:author,\
        ctl:ruleRemoveTargetById=3100022;ARGS:author,\
