# [Phase 1] 알려진 오타 경로 및 숫자형 Host 예외
# ----------------------------------------------------------------
# 적용 범위:
# - 본 서비스 도메인에서 발생하는 명확한 프로젝트 경로 오타만 허용
# - URI/Referer 오타 케이스는 protocol 계열 검사 대상만 제한적으로 완화

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1005000,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_PUBLIC_TYPO_URI_ALLOW',\
    msg:'PROJECT_PUBLIC_TYPO_URI_ALLOW'"
    SecRule REQUEST_URI_RAW "@rx (?i)^/(?:api/public/)?(?:annoucements|annuoncements|annuncements|annnouncements|acaedmic-events|acaemic-events|acedemic-events|academc-events|support-reuqests|suport-requests|supprot-requests)/?(?:[0-9]+/?)?$" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_URI,\
    ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_LINE"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1005001,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_APP_TYPO_URI_ALLOW',\
    msg:'PROJECT_APP_TYPO_URI_ALLOW'"
    SecRule REQUEST_URI_RAW "@rx (?i)^/api/(?:board/(?:posst|poosts)(?:/[0-9]+)?|board/posts/[0-9]+/(?:commnets|comentts|commments)/[0-9]+|lms/(?:assignmnets|assingments|assginments)/[0-9]+(?:/submissions)?|lms/(?:submissons|submisions)/[0-9]+/grade|auth/(?:logni|lgoin|regitser|regsiter|refersh))/?$" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_URI,\
    ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_LINE"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1005002,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_TYPO_REFERER_ALLOW',\
    msg:'PROJECT_TYPO_REFERER_ALLOW'"
    SecRule REQUEST_HEADERS:Referer "@rx (?i)^https?://(?:www\.)?kj\.ac\.kr(?::\d+)?/.*(?:annoucements|annuoncements|annuncements|annnouncements|acaedmic-events|acaemic-events|acedemic-events|academc-events|support-reuqests|suport-requests|supprot-requests|posst|poosts|commnets|comentts|commments|assignmnets|assingments|assginments|submissons|submisions|logni|lgoin|regitser|regsiter|refersh|(?:vourse|coruse|coures|cuorse|cousre|cource|coursse|coourse)s?)\b" \
    "t:none,ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_HEADERS:Referer"

# LMS course typo URI allow for frontend and API paths
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1005003,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_LMS_COURSE_TYPO_ALLOW',\
    msg:'PROJECT_LMS_COURSE_TYPO_ALLOW'"
    SecRule REQUEST_URI_RAW "@rx (?i)^/(?:(?:lms/(?:vourse|coruse|coures|cuorse|cousre|cource|coursse|coourse)s?(?:/[0-9]+)?)|(?:api/lms/(?:vourse|coruse|coures|cuorse|cousre|cource|coursse|coourse)s?/(?:my|[0-9]+/assignments))|(?:api/lms/admin/(?:vourse|coruse|coures|cuorse|cousre|cource|coursse|coourse)s?))/?(?:\?.*)?$" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_URI,\
    ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_URI_RAW,\
    ctl:ruleRemoveTargetByTag=attack-protocol;REQUEST_LINE"

