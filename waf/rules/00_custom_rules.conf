# ----------------------------------------------------------------
# Project-adapted ModSecurity rules for kj.ac.kr / www.kj.ac.kr
# ----------------------------------------------------------------

# ----------------------------------------------------------------
# Board API method policy exception
# ----------------------------------------------------------------
# Keep CRS 911100 active globally, but allow the board edit/delete routes
# used by this project before method enforcement runs.
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990130, \
    phase:1, \
    pass, \
    nolog, \
    chain"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
        SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/?$" \
            "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990131, \
    phase:1, \
    pass, \
    nolog, \
    chain"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
        SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/comments/[0-9]+/?$" \
            "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990132, \
    phase:1, \
    pass, \
    nolog, \
    chain"
    SecRule REQUEST_METHOD "@streq OPTIONS" "chain"
        SecRule REQUEST_FILENAME "@rx ^/api/board/posts(?:/[0-9]+(?:/comments/[0-9]+)?)?/?$" \
            "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} OPTIONS'"

# ----------------------------------------------------------------
# Query-aware custom blocking rules
# ----------------------------------------------------------------
# These rules inspect search/query arguments because the project JMX traffic
# places suspicious tokens in GET parameters rather than URI path segments.
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3000001, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    chain, \
    msg:'Explicit SQLi token in board/public search query'"
    SecRule REQUEST_FILENAME "@rx ^/api/(?:board/posts|public/(?:announcements|academic-events))/?$" "chain"
        SecRule ARGS_GET|ARGS "@rx (?i)\bunion\b\s+(?:all\s+)?\bselect\b|\bbenchmark\s*\(|\bsleep\s*\(|\bwaitfor\s+delay\b" "t:none"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3000002, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    chain, \
    msg:'Traversal token in board/public search query'"
    SecRule REQUEST_FILENAME "@rx ^/api/(?:board/posts|public/(?:announcements|academic-events))/?$" "chain"
        SecRule ARGS_GET|ARGS "@rx (?i)(?:\.\./|%2e%2e|%252e%252e).{0,16}(?:/|\\|%2f|%5c)|/etc/passwd|boot\.ini" "t:none"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3000003, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    chain, \
    msg:'Command or JNDI token in board/public search query'"
    SecRule REQUEST_FILENAME "@rx ^/api/(?:board/posts|public/(?:announcements|academic-events))/?$" "chain"
        SecRule ARGS_GET|ARGS "@rx (?i)(?:;|\|\||&&|\|)\s*(?:whoami|id|curl|wget|cat)\b|\$\{jndi:|cmd\.exe\b|powershell\s+-enc\b|`[^`]+`|\$\([^\)]+\)" "t:none"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3000004, \
    phase:2, \
    deny, \
    status:403, \
    log, \
    chain, \
    msg:'XSS token in board/public search query'"
    SecRule REQUEST_FILENAME "@rx ^/api/(?:board/posts|public/(?:announcements|academic-events))/?$" "chain"
        SecRule ARGS_GET|ARGS "@rx (?i)<\s*script\b|<\s*img\b[^>]*onerror\s*=|javascript:" "t:none"

# ----------------------------------------------------------------
# Typo/AI-generated benign host-header exception for project typo routes
# ----------------------------------------------------------------
# Keep this narrowly focused on known typo tokens used in the project datasets.
SecRule REQUEST_URI_RAW "@rx (?:coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse|annuoncements|annuncements|acaedmic-events|acaemic-events|posst)" \
    "id:1000001, \
    phase:1, \
    pass, \
    nolog, \
    noauditlog, \
    ctl:ruleRemoveById=920350, \
    msg:'PROJECT_TYPO_920350_URI_SUPPRESS'"

SecRule REQUEST_HEADERS:Referer "@rx (?:coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse|annuoncements|annuncements|acaedmic-events|acaemic-events|posst)" \
    "id:1000002, \
    phase:1, \
    pass, \
    nolog, \
    noauditlog, \
    ctl:ruleRemoveById=920350, \
    msg:'PROJECT_TYPO_920350_REFERER_SUPPRESS'"

SecRule REQUEST_HEADERS:Host "@rx ^[\d\.]+$" \
    "id:1000003, \
    phase:1, \
    pass, \
    nolog, \
    noauditlog, \
    ctl:ruleRemoveById=920350, \
    msg:'PROJECT_NUMERIC_HOST_920350_SUPPRESS'"
