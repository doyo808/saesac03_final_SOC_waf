# ----------------------------------------------------------------
# kj.ac.kr / www.kj.ac.kr 전용 ModSecurity 커스텀 룰
# 목적: 오탐(False Positive) 완화 전용
# 로딩 순서: docker-compose에서 CRS보다 먼저 로드
# 룰 ID 체계:
# - 1001000-1001999 : 메서드 예외
# - 1002000-1002999 : 검색 경로 인자 튜닝
# - 1003000-1003999 : 공개 문의 필드 튜닝
# - 1004000-1004999 : 게시판, LMS, 인증 필드 튜닝
# - 1005000-1005999 : 오타 경로 및 Host 예외
# 참고:
# - 920350은 CRS의 숫자형 Host 헤더 검사 룰이며,
#   아래 IP Host 허용 예외에서만 사용한다.
# - 본문 입력이 많은 쓰기 경로라도 일반적으로 XSS 검사는 유지한다.
#   예외적으로 코드/스크립트 예시가 많이 포함되는 LMS 제출 경로만
#   더 좁은 범위로 완화한다.
# ----------------------------------------------------------------

SecAuditLogParts ABCEFHJKZ

# [Phase 1] 게시판 CRUD 메서드 예외
# ----------------------------------------------------------------

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1001000,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_BOARD_POST_METHOD_ALLOW',\
    msg:'PROJECT_BOARD_POST_METHOD_ALLOW'"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/?$" \
    "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1001001,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_BOARD_COMMENT_METHOD_ALLOW',\
    msg:'PROJECT_BOARD_COMMENT_METHOD_ALLOW'"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/comments/[0-9]+/?$" \
    "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1001002,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_BOARD_OPTIONS_ALLOW',\
    msg:'PROJECT_BOARD_OPTIONS_ALLOW'"
    SecRule REQUEST_METHOD "@streq OPTIONS" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts(?:/[0-9]+(?:/comments(?:/[0-9]+)?)?)?/?$" \
    "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} OPTIONS'"

# [Phase 1] 검색 경로 오탐 완화
# ----------------------------------------------------------------
# 적용 범위:
# - GET /api/board/posts -> keyword, author
# - GET /api/public/announcements -> keyword
# 설계 원칙:
# - 애플리케이션은 해당 값을 문자열 검색 조건으로 처리한다.
# - 예외 범위는 경로 + 메서드 + 인자 단위로만 좁게 적용한다.

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1002000,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_BOARD_SEARCH_KEYWORD_FP_TUNING',\
    msg:'PROJECT_BOARD_SEARCH_KEYWORD_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/?$" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:keyword"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1002001,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_BOARD_SEARCH_AUTHOR_FP_TUNING',\
    msg:'PROJECT_BOARD_SEARCH_AUTHOR_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/?$" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:author,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:author,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:author,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:author"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1002002,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_ANNOUNCEMENT_SEARCH_KEYWORD_FP_TUNING',\
    msg:'PROJECT_ANNOUNCEMENT_SEARCH_KEYWORD_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/public/announcements/?$" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:keyword"

# [Phase 1] 공개 문의 본문 필드 오탐 완화
# ----------------------------------------------------------------
# 적용 범위:
# - POST /api/public/support-requests
# - JSON 본문 필드만 대상
# 가드레일:
# - XSS 검사는 유지한다.
# - 문의 제목/본문/참고 URL에 보안 용어, 경로, URL이 포함되어도
#   과도하게 차단되지 않도록 SQLi/RCE/LFI 대상만 좁게 완화한다.

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1003000,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_SUPPORT_REQUEST_SUBJECT_FP_TUNING',\
    msg:'PROJECT_SUPPORT_REQUEST_SUBJECT_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq POST" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/public/support-requests/?$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:subject,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.subject,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:subject,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.subject,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:subject,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.subject"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1003001,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_SUPPORT_REQUEST_MESSAGE_FP_TUNING',\
    msg:'PROJECT_SUPPORT_REQUEST_MESSAGE_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq POST" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/public/support-requests/?$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:message,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.message,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:message,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.message,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:message,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.message"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1003002,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_SUPPORT_REQUEST_REFERENCE_URL_FP_TUNING',\
    msg:'PROJECT_SUPPORT_REQUEST_REFERENCE_URL_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq POST" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/public/support-requests/?$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:referenceUrl,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.referenceUrl,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:referenceUrl,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.referenceUrl,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:referenceUrl,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.referenceUrl"

# [Phase 1] 게시판, LMS, 인증 본문 필드 오탐 완화
# ----------------------------------------------------------------
# 가드레일:
# - 게시판/인증 쓰기 경로는 XSS 검사를 유지한다.
# - LMS 과제 제출만 예외적으로 코드/스크립트 예시 본문이 자주 들어오므로
#   SQLi/RCE/LFI 우선 완화만 적용한다.
# - LMS 제출 본문의 XSS 완화는 운영 전 즉시 활성화하지 않고
#   관찰 후보로만 남긴다.

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1004000,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_BOARD_POST_TITLE_FP_TUNING',\
    msg:'PROJECT_BOARD_POST_TITLE_FP_TUNING'"
    SecRule REQUEST_METHOD "@within POST PUT" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts(?:/[0-9]+(?:/update)?)?/?$" "chain"
    SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+[A-Za-z0-9._-]+$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.title,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.title,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:title,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.title"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1004001,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_BOARD_POST_CONTENT_FP_TUNING',\
    msg:'PROJECT_BOARD_POST_CONTENT_FP_TUNING'"
    SecRule REQUEST_METHOD "@within POST PUT" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts(?:/[0-9]+(?:/update)?)?/?$" "chain"
    SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+[A-Za-z0-9._-]+$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.content"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1004002,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_BOARD_COMMENT_CONTENT_FP_TUNING',\
    msg:'PROJECT_BOARD_COMMENT_CONTENT_FP_TUNING'"
    SecRule REQUEST_METHOD "@within POST PUT" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/comments(?:/[0-9]+(?:/update)?)?/?$" "chain"
    SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+[A-Za-z0-9._-]+$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.content,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:content,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.content"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1004003,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_LMS_SUBMISSION_CONTENT_FP_TUNING',\
    msg:'PROJECT_LMS_SUBMISSION_CONTENT_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq POST" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/lms/assignments/[0-9]+/submissions/?$" "chain"
    SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+[A-Za-z0-9._-]+$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:contentText,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.contentText,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:contentText,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.contentText,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:contentText,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.contentText"

# XSS 완화 관찰 후보:
# - 실제 운영 로그에서 contentText 기반 XSS 과탐이 충분히 확인될 때만 활성화 검토
# - 보류 중인 후보 액션:
#   ctl:ruleRemoveTargetByTag=attack-xss;ARGS:contentText
#   ctl:ruleRemoveTargetByTag=attack-xss;ARGS:json.contentText

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1004004,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'FP_TUNING',\
    tag:'PROJECT_LMS_GRADE_FEEDBACK_FP_TUNING',\
    msg:'PROJECT_LMS_GRADE_FEEDBACK_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq POST" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/lms/submissions/[0-9]+/grade/?$" "chain"
    SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+[A-Za-z0-9._-]+$" "chain"
    SecRule REQUEST_HEADERS:Content-Type "@contains application/json" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:feedback,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.feedback,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:feedback,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:json.feedback,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:feedback,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:json.feedback"

