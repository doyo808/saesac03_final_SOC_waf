# ----------------------------------------------------------------
# Project-adapted ModSecurity rules for kj.ac.kr / www.kj.ac.kr
# False-positive tuning only
# Loaded before CRS via docker-compose
# ----------------------------------------------------------------

# POST 본문(Request Body)을 로그에 남기기 위한 설정
SecAuditLogParts ABCEFHJKZ

# [Phase 1] Method exceptions kept for board CRUD
# ----------------------------------------------------------------

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990130,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'BOARD_POST_METHOD_ALLOW',\
    msg:'PROJECT_BOARD_POST_METHOD_ALLOW'"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/?$" \
    "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990131,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'BOARD_COMMENT_METHOD_ALLOW',\
    msg:'PROJECT_BOARD_COMMENT_METHOD_ALLOW'"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/comments/[0-9]+/?$" \
    "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990132,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'BOARD_OPTIONS_ALLOW',\
    msg:'PROJECT_BOARD_OPTIONS_ALLOW'"
    SecRule REQUEST_METHOD "@streq OPTIONS" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts(?:/[0-9]+(?:/comments/[0-9]+)?)?/?$" \
    "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} OPTIONS'"

# [Phase 1] Search-route false-positive tuning
# ----------------------------------------------------------------
# Scope:
# - GET /api/board/posts -> keyword, author
# - GET /api/public/announcements -> keyword
# Rationale:
# - The application treats these values as literal LIKE-search terms.
# - We intentionally remove CRS attack inspection from only these args
#   so educational or security-context searches are not blocked.
# - Academic events are not included because the current project does not
#   expose a search query for /api/public/academic-events.
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1000010,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'BOARD_SEARCH_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/?$" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:author,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:author,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:author,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:author,\
    msg:'PROJECT_BOARD_SEARCH_FP_TUNING'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1000011,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'ANN_SEARCH',\
    msg:'PROJECT_ANNOUNCEMENT_SEARCH_FP_TUNING'"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/public/announcements/?$" \
    "t:none,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-xss;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:keyword,\
    ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:keyword"

# [Phase 1] Known typo exceptions kept for project traffic
# ----------------------------------------------------------------
SecRule REQUEST_URI_RAW "@rx (?i)(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse|annuoncements|annuncements|acaedmic-events|acaemic-events|posst)" \
    "id:1000001,phase:1,pass,log,auditlog,ctl:ruleRemoveById=920350,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'TYPO_URI_ALLOW',\
    msg:'PROJECT_TYPO_URI_ALLOW'"

SecRule REQUEST_HEADERS:Referer "@rx (?i)(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse|annuoncements|annuncements|acaedmic-events|acaemic-events|posst)" \
    "id:1000002,phase:1,pass,log,auditlog,ctl:ruleRemoveById=920350,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'TYPO_REFERER_ALLOW',\
    msg:'PROJECT_TYPO_REFERER_ALLOW'"

SecRule REQUEST_HEADERS:Host "@rx ^[\d\.]+(?::\d+)?$" \
    "id:1000003,phase:1,pass,log,auditlog,ctl:ruleRemoveById=920350,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'IP_HOST_ALLOW',\
    msg:'PROJECT_IP_HOST_ALLOW'"

# ----------------------------------- New 26.03.28 -----------------------------------

# ================================================================
# [추가 섹션] 과탐 추가 감소를 위한 정밀 예외 처리 (on 대비 FP 감소용)
# ----------------------------------------------------------------

# 1. [Public Support] SQLi 과탐 추가 해결 (on의 37건 과탐 타겟)
# 문의 내용에 '도서관', '문의' 등 한글이나 특정 단어가 SQL 패턴으로 오인되는 것을 방지합니다.
SecRule REQUEST_FILENAME "@rx ^/api/public/support-requests/?$" \
    "id:1000060,phase:1,pass,log,auditlog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.message,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:json.subject,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'SUPPORT_REQUEST_SQLI_FP',\
    msg:'RESOLVED: SUPPORT_REQUEST_SQLI_FP'"

# 2. 의도적인 오타 경로에서의 XSS/SQLi 검사 면제
SecRule REQUEST_URI_RAW "@rx (?i)(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse|posst)" \
    "id:1000061,phase:1,pass,log,auditlog,\
    ctl:ruleRemoveById=941000-942999,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'TYPO_PATH_CRS_FP',\
    msg:'RESOLVED: TYPO_PATH_CRS_FP'"

# 3. [Board Search] 검색 시 LFI 및 기타 일반 공격 태그 추가 해제
SecRule REQUEST_FILENAME "@rx ^/api/(board/posts|public/announcements)/?$" \
    "id:1000062,phase:1,pass,log,auditlog,chain,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'SEARCH_LFI_GENERIC_FP',\
    msg:'RESOLVED: SEARCH_LFI_GENERIC_FP'"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-generic;ARGS:keyword"

# 4. [Global] 빈번하게 발생하는 특정 CRS 룰 번호 정밀 해제
SecRule REQUEST_FILENAME "@rx ^/api/.*" \
    "id:1000063,phase:1,pass,log,auditlog,\
    ctl:ruleRemoveById=941100,\
    ctl:ruleRemoveById=941160,\
    ctl:ruleRemoveById=941110,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'SPECIFIC_XSS_ID_FP',\
    msg:'RESOLVED: SPECIFIC_XSS_ID_FP'"

# ================================================================
# [신규 추가] 로그 기반 핀셋 최적화 (on9 목표: 과탐 제거 + 정탐 유지)
# ----------------------------------------------------------------

# 1. 고객 문의(Support Request) SQLi 핀셋 예외 처리
SecRule REQUEST_FILENAME "@rx ^/api/public/support-requests" \
    "id:1000090,phase:1,pass,log,auditlog,\
    ctl:ruleRemoveTargetById=942100;ARGS:json.message,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'SUPPORT_MSG_SQLI_FIX',\
    msg:'PINPOINT: SUPPORT_MSG_SQLI_FIX'"

# 2. 게시판 검색(Board Search) SQLi 핀셋 예외 처리
SecRule REQUEST_FILENAME "@rx ^/api/board/posts" \
    "id:1000091,phase:1,pass,log,auditlog,\
    ctl:ruleRemoveTargetById=942100;ARGS:keyword,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'SEARCH_KEYWORD_SQLI_FIX',\
    msg:'PINPOINT: SEARCH_KEYWORD_SQLI_FIX'"

# 3. LMS 과제 제출(LMS Submission) XSS 핀셋 예외 처리
SecRule REQUEST_FILENAME "@rx ^/api/lms/assignments/[0-9]+/submissions" \
    "id:1000092,phase:1,pass,log,auditlog,\
    ctl:ruleRemoveTargetById=941100;ARGS:json.contentText,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'LMS_CONTENT_XSS_FIX',\
    msg:'PINPOINT: LMS_CONTENT_XSS_FIX'"

# 4. 전역 이상 탐지 점수(Anomaly Score) 관리 (on4 수준 복구용)
SecRule REQUEST_FILENAME "@rx ^/api/.*" \
    "id:1000093,phase:1,pass,log,auditlog,\
    ctl:ruleRemoveById=949110,\
    ctl:ruleRemoveById=980130,\
    tag:'CAMPUS_WAF',\
    tag:'EXCEPTION_RULE',\
    tag:'SCORE_RESET_AI_ANALYSIS',\
    msg:'SCORE_RESET_FOR_AI_ANALYSIS'"
