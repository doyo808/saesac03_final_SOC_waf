# ----------------------------------------------------------------
# Project Custom Rules - Non-Breakable Clean Version
# ----------------------------------------------------------------

# 1. Method Exception (ID: 5000001)
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" "id:5000001,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/?$" "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

# 2. SQLi Blocking (ID: 5000002) - 미탐 해결 핵심
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" "id:5000002,phase:2,deny,status:403,log,chain,msg:'SQLi detected'"
    SecRule REQUEST_FILENAME "@rx ^/api/(board/posts|public/(announcements|academic-events))/?$" "chain"
    SecRule ARGS_GET|ARGS "@rx (?i)\bunion\b\s+(all\s+)?select\b|benchmark\s*\(|sleep\s*\(|waitfor\s+delay\b" "t:none"

# 3. Path Traversal (ID: 5000003)
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" "id:5000003,phase:2,deny,status:403,log,chain,msg:'Traversal detected'"
    SecRule REQUEST_FILENAME "@rx ^/api/(board/posts|public/(announcements|academic-events))/?$" "chain"
    SecRule ARGS_GET|ARGS "@rx (?i)(\.\./|%2e%2e|%252e%252e).{0,16}(/|\\|%2f|%5c)|/etc/passwd|boot\.ini" "t:none"

# 4. Typo Exception (ID: 5000004) - 과탐 해결
SecRule REQUEST_URI_RAW "@rx (?i)(coruse|vourse|annuoncements|posst)" "id:5000004,phase:1,pass,nolog,noauditlog,ctl:ruleRemoveById=920350,msg:'TYPO_ALLOWED'"
