# ----------------------------------------------------------------
# Project-adapted ModSecurity rules for kj.ac.kr / www.kj.ac.kr
# Focus: False-positive reduction + AI-based reclassification
# ----------------------------------------------------------------

# 로그 기록 범위 설정 (AI 분석을 위해 상세 기록)
SecAuditLogParts ABCEFHJKZ

# ----------------------------------------------------------------
# [Phase 1] Method & Basic Exceptions (가용성 확보)
# ----------------------------------------------------------------

# 1. 게시판 CRUD를 위한 메서드 허용 [cite: 5, 8]
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990130,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/?$" \
        "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:990131,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@within PUT DELETE" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/comments/[0-9]+/?$" \
        "t:none,setvar:'tx.allowed_methods=%{tx.allowed_methods} PUT DELETE'"

# 2. IP 기반 접속 허용 (Host IP 매칭 과탐 해소) [cite: 9, 12]
SecRule REQUEST_HEADERS:Host "@rx ^[\d\.]+(?::\d+)?$" \
    "id:1000003,phase:1,pass,nolog,noauditlog,ctl:ruleRemoveById=920350,msg:'PROJECT_IP_HOST_ALLOW'"

# ----------------------------------------------------------------
# [Phase 1] 특정 경로 세밀 예외 처리 (과탐 핵심 구역)
# ----------------------------------------------------------------

# 1. 검색 경로 CRS 태그 제거 (정상적인 학술 검색 허용) 
SecRule REQUEST_FILENAME "@rx ^/api/(board/posts|public/announcements)/?$" \
    "id:1000010,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,\
        ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-rce;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:keyword,\
        msg:'PROJECT_SEARCH_FP_TUNING'"

# 2. LMS 과제 제출 경로 성역 지정 (학생들의 코드 제출 허용) [cite: 8, 15]
# 모든 커스텀 탐지 룰(3100xxx)에서 해당 경로의 본문 내용을 제외합니다.
SecRule REQUEST_FILENAME "@rx ^/api/lms/assignments/[0-9]+/submissions/?$" \
    "id:1000020,phase:1,pass,nolog,\
    ctl:ruleRemoveById=3100001-3100060,\
    msg:'LMS_SUBMISSION_SAFE_ZONE'"

# ----------------------------------------------------------------
# [Phase 2] 커스텀 탐지 룰: '차단' 대신 'AI 분석용 로그 생성' (Pass 모드)
# ----------------------------------------------------------------
# 모든 룰의 액션을 'deny'에서 'pass'로 변경하여 실시간 차단으로 인한 과탐을 제거합니다. 

# SQLi 패턴 (UNION, OR 1=1 등)
SecRule ARGS_GET|ARGS "@rx \bunion\s+select\b" \
    "id:3100001,phase:2,pass,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,msg:'POTENTIAL_SQLI_FOR_AI',tag:'KJ_CUSTOM',tag:'FOR_AI_ANALYSIS'"

SecRule ARGS_GET|ARGS "@rx \bor\s+1=1\b" \
    "id:3100002,phase:2,pass,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,msg:'POTENTIAL_SQLI_FOR_AI',tag:'KJ_CUSTOM',tag:'FOR_AI_ANALYSIS'"

# XSS 패턴 (script 태그 등)
SecRule ARGS_GET|ARGS "@rx <script\b[^>]*>.*?</script>" \
    "id:3100011,phase:2,pass,log,auditlog,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,msg:'POTENTIAL_XSS_FOR_AI',tag:'KJ_CUSTOM',tag:'FOR_AI_ANALYSIS'"

# RCE 패턴 (시스템 함수 호출 등) [cite: 31]
SecRule ARGS_GET|ARGS "@rx \b(eval|exec|system|shell_exec|curl|wget)\s*[\(\s]" \
    "id:3100033,phase:2,pass,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,msg:'POTENTIAL_RCE_FOR_AI',tag:'KJ_CUSTOM',tag:'FOR_AI_ANALYSIS'"

# 경로 탐색 패턴 (../ 등)
SecRule ARGS_GET|ARGS "@rx (\.\./|\.\.\\|/etc/passwd)" \
    "id:3100021,phase:2,pass,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,msg:'POTENTIAL_TRAVERSAL_FOR_AI',tag:'KJ_CUSTOM',tag:'FOR_AI_ANALYSIS'"

# ----------------------------------------------------------------
# [Phase 1] 오타(Typo) 예외 처리 유지
# ----------------------------------------------------------------
SecRule REQUEST_URI_RAW "@rx (?i)(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse|posst)" \
    "id:1000001,phase:1,pass,nolog,noauditlog,ctl:ruleRemoveById=920350,msg:'PROJECT_TYPO_ALLOW'"
