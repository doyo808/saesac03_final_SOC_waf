# ----------------------------------------------------------------
# Project: kj.ac.kr WAF Custom Rules (FP Optimized)
# Description: Integrated exclusions for CRS and Custom AI-Detection
# ----------------------------------------------------------------

# AI 분석을 위한 상세 감사 로그 설정
SecAuditLogParts ABCEFHJKZ

# ================================================================
# [SECTION 1] Phase 1: CRS 룰 강제 제외 (과탐 77건 해결의 핵심)
# ================================================================

# 1. [전역] Host IP 접속 허용 (보고서 식별 사례: 920350)
# 도메인이 아닌 IP로 접근할 때 발생하는 차단을 해제합니다.
SecRule REQUEST_HEADERS:Host "@rx ^[\d\.]+(?::\d+)?$" \
    "id:1000030,phase:1,pass,nolog,ctl:ruleRemoveById=920350,msg:'RESOLVED: HOST_IP_MATCH_FP'"

# 2. [게시판/공지사항] 검색 경로 CRS XSS/SQLi 해제
# JMeter 'Public Post' 및 'Board Search'의 45건 차단을 해결합니다.
SecRule REQUEST_FILENAME "@rx ^/api/(board/posts|public/announcements)/?$" \
    "id:1000031,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,ctl:ruleRemoveById=941000-942999,msg:'RESOLVED: SEARCH_CRS_FP'"

# 3. [LMS/지원] 사용자 콘텐츠 입력 경로 예외 처리
# 정상적인 문의나 과제 내용이 XSS로 오탐되는 것을 방지합니다.
SecRule REQUEST_FILENAME "@rx ^/api/(public/support-requests|lms/assignments)/?$" \
    "id:1000032,phase:1,pass,nolog,ctl:ruleRemoveById=941000-941999,msg:'RESOLVED: USER_CONTENT_FP'"

# 4. [메서드] PUT/DELETE 제한 해제 (보고서 식별 사례: 911100)
# 게시판 CRUD 기능의 가용성을 확보합니다.
SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/?$" \
    "id:1000033,phase:1,pass,nolog,ctl:ruleRemoveById=911100,msg:'RESOLVED: BOARD_METHOD_FP'"


# ================================================================
# [SECTION 2] Phase 1: 커스텀 탐지 룰(3100xxx) 예외 설정
# ================================================================
# 본인이 만든 커스텀 룰이 검색어나 과제 제출을 막지 않도록 성역을 지정합니다.

SecRule REQUEST_FILENAME "@rx ^/api/lms/assignments/[0-9]+/submissions/?$" \
    "id:1000020,phase:1,pass,nolog,\
    ctl:ruleRemoveById=3100001-3100060,\
    msg:'LMS_SUBMISSION_SAFE_ZONE'"


# ================================================================
# [SECTION 3] Phase 2: AI 분석용 커스텀 탐지 (Pass 모드)
# ================================================================
# 'deny' 대신 'pass'를 사용하여 실시간 차단은 끄고, AI에게 넘길 로그만 생성합니다.

# SQLi 의심 패턴
SecRule ARGS_GET|ARGS "@rx \bunion\s+select\b" \
    "id:3100001,phase:2,pass,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ_SQLI_FOR_AI',tag:'FOR_AI_ANALYSIS'"

SecRule ARGS_GET|ARGS "@rx \bor\s+1=1\b" \
    "id:3100002,phase:2,pass,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ_SQLI_FOR_AI',tag:'FOR_AI_ANALYSIS'"

# XSS 의심 패턴
SecRule ARGS_GET|ARGS "@rx <script\b[^>]*>.*?</script>" \
    "id:3100011,phase:2,pass,log,auditlog,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,msg:'KJ_XSS_FOR_AI',tag:'FOR_AI_ANALYSIS'"

# RCE 의심 패턴
SecRule ARGS_GET|ARGS "@rx \b(eval|exec|system|shell_exec|curl|wget)\s*[\(\s]" \
    "id:3100033,phase:2,pass,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ_RCE_FOR_AI',tag:'FOR_AI_ANALYSIS'"


# ================================================================
# [SECTION 4] Phase 1: 오타(Typo) 예외 처리
# ================================================================
SecRule REQUEST_URI_RAW "@rx (?i)(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse|posst)" \
    "id:1000001,phase:1,pass,nolog,noauditlog,ctl:ruleRemoveById=920350,msg:'PROJECT_TYPO_ALLOW'"
