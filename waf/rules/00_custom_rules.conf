# [Phase 1] Known typo exceptions kept for project traffic
# ----------------------------------------------------------------
SecRule REQUEST_URI_RAW "@rx (?i)(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse|annuoncements|annuncements|acaedmic-events|acaemic-events|posst)" \
    "id:1000001,phase:1,pass,nolog,noauditlog,ctl:ruleRemoveById=920350,msg:'PROJECT_TYPO_URI_ALLOW'"

SecRule REQUEST_HEADERS:Referer "@rx (?i)(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse|annuoncements|annuncements|acaedmic-events|acaemic-events|posst)" \
    "id:1000002,phase:1,pass,nolog,noauditlog,ctl:ruleRemoveById=920350,msg:'PROJECT_TYPO_REFERER_ALLOW'"

SecRule REQUEST_HEADERS:Host "@rx ^[\d\.]+(?::\d+)?$" \
    "id:1000003,phase:1,pass,nolog,noauditlog,ctl:ruleRemoveById=920350,msg:'PROJECT_IP_HOST_ALLOW'"

# ----------------------------------------------------------------
# [추가] False-positive reduction oriented custom detection rules
# Scope: kj.ac.kr / www.kj.ac.kr only
# Policy:
# - Use only high-confidence payloads for deny
# - Keep broad recon/generic patterns as pass,log
# - Avoid broad single-keyword blocking
# ----------------------------------------------------------------

# [Phase 2] SQLi - high-confidence only
# ----------------------------------------------------------------
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100001,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ SQLi high-confidence pattern: UNION SELECT',tag:'KJ_CUSTOM',tag:'attack-sqli',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx \bunion\s+select\b"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100002,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ SQLi high-confidence pattern: OR 1=1',tag:'KJ_CUSTOM',tag:'attack-sqli',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx \bor\s+1=1\b"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100003,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ SQLi high-confidence pattern: sleep()',tag:'KJ_CUSTOM',tag:'attack-sqli',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx \bsleep\s*\(\s*\d+\s*\)"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100004,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ SQLi high-confidence pattern: benchmark()',tag:'KJ_CUSTOM',tag:'attack-sqli',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx \bbenchmark\s*\("

# [Phase 2] XSS - narrow and explicit patterns only
# ----------------------------------------------------------------
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100011,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,msg:'KJ XSS high-confidence pattern: script tag payload',tag:'KJ_CUSTOM',tag:'attack-xss',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx <script\b[^>]*>.*?</script>"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100012,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,msg:'KJ XSS high-confidence pattern: javascript alert',tag:'KJ_CUSTOM',tag:'attack-xss',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx javascript:\s*alert\s*\("

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100013,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,msg:'KJ XSS high-confidence pattern: inline event handler execution',tag:'KJ_CUSTOM',tag:'attack-xss',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx \bon(error|load)\s*=\s*['\"]?(alert|prompt|confirm)\s*\("

# [Phase 2] Path Traversal - explicit traversal or sensitive file access
# ----------------------------------------------------------------
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100021,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ path traversal high-confidence pattern',tag:'KJ_CUSTOM',tag:'attack-lfi',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx (\.\./|\.\.\\|%2e%2e%2f|%2e%2e%5c)"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100022,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ sensitive file access high-confidence pattern',tag:'KJ_CUSTOM',tag:'attack-lfi',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx (?i)(/etc/passwd|/etc/shadow|boot\.ini|win\.ini)"

# [Phase 2] RCE / command execution - explicit execution forms only
# ----------------------------------------------------------------
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100031,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ RCE high-confidence pattern: shell execution form',tag:'KJ_CUSTOM',tag:'attack-rce',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx (?i)(/bin/sh|/bin/bash|cmd\.exe|powershell\s+-|bash\s+-c)"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100032,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ RCE high-confidence pattern: remote fetch command',tag:'KJ_CUSTOM',tag:'attack-rce',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx \b(curl|wget)\b\s+(http|https)://"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100033,phase:2,deny,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ RCE high-confidence pattern: code execution function',tag:'KJ_CUSTOM',tag:'attack-rce',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx \b(eval|exec|system|passthru|shell_exec)\s*\("

# [Phase 1] Recon / scan - observe only, do not block
# ----------------------------------------------------------------
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100041,phase:1,pass,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ recon observed: common scan path',tag:'KJ_CUSTOM',tag:'recon',tag:'fp-reduction'"
    SecRule REQUEST_URI "@rx (?i)(/wp-login\.php|/xmlrpc\.php|/phpmyadmin|/manager/html|/cgi-bin/)"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100042,phase:1,pass,log,auditlog,chain,t:none,t:urlDecodeUni,t:lowercase,msg:'KJ recon observed: sensitive endpoint access',tag:'KJ_CUSTOM',tag:'recon',tag:'fp-reduction'"
    SecRule REQUEST_URI "@rx (?i)(/\.env|/server-status|/actuator|/swagger|/graphql)"

# [Phase 2] Generic suspicious indicators - observe only, do not block
# ----------------------------------------------------------------
SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:3100051,phase:2,pass,log,auditlog,chain,t:none,t:urlDecodeUni,t:htmlEntityDecode,t:lowercase,msg:'KJ suspicious exploit-related keyword observed',tag:'KJ_CUSTOM',tag:'generic-suspicious',tag:'fp-reduction'"
    SecRule ARGS|QUERY_STRING "@rx (?i)(base64_decode|fromcharcode|document\.cookie|window\.location)"

# End of local pre-CRS custom rules.
