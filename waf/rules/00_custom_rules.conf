        ctl:ruleRemoveTargetById=3100032;ARGS:author,\
        ctl:ruleRemoveTargetById=3100033;ARGS:author,\
        ctl:ruleRemoveTargetById=3100051;ARGS:author,\
        msg:'PROJECT_BOARD_SEARCH_EXCLUDE_CUSTOM_DENY_RULES'"

SecRule REQUEST_HEADERS:Host "@rx ^(?:www\.)?kj\.ac\.kr(?::\d+)?$" \
    "id:1000013,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq GET" "chain"
    SecRule REQUEST_FILENAME "@rx ^/api/public/announcements/?$" \
        "t:none,\
        ctl:ruleRemoveTargetById=3100001;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100002;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100003;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100004;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100011;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100012;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100013;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100021;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100022;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100031;ARGS:keyword,\
        ctl:ruleRemoveTargetById=3100032;ARGS:keyword,\
