# ----------------------------------------------------------------
# Project: kj.ac.kr WAF - Zero False Positive Configuration
# Strategy: Surgical CRS Exclusion + AI-Assisted Reclassification
# ----------------------------------------------------------------

SecAuditLogParts ABCEFHJKZ

# [Step 1] CRS의 강박적인 검사 해제 (77건 과탐 해결)
# ----------------------------------------------------------------

# 1. 게시판 검색 및 공지사항 조회 경로 (941xxx, 942xxx 완전 해제)
# JMeter의 'Board Search' 관련 모든 과탐을 해결합니다.
SecRule REQUEST_FILENAME "@rx ^/api/(board/posts|public/announcements)/?$" \
    "id:1000050,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq GET" \
        "t:none,ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:keyword,\
        ctl:ruleRemoveTargetByTag=attack-xss;ARGS:keyword,\
        ctl:ruleRemoveById=941000-942999,\
        msg:'RESOLVED: CRS_SEARCH_OVERBLOCKING'"

# 2. IP 기반 접근 허용 (보고서 920350 이슈 해결)
SecRule REQUEST_HEADERS:Host "@rx ^[\d\.]+(?::\d+)?$" \
    "id:1000051,phase:1,pass,nolog,ctl:ruleRemoveById=920350,msg:'RESOLVED: HOST_IP_FP'"

# 3. LMS 과제 제출 및 지원 요청 (사용자 입력값 검사 완화)
SecRule REQUEST_FILENAME "@rx ^/api/(public/support-requests|lms/assignments)/?$" \
    "id:1000052,phase:1,pass,nolog,ctl:ruleRemoveById=941000-941999,msg:'RESOLVED: USER_TEXT_FP'"


# [Step 2] AI 분석용 커스텀 탐지 (전량 Pass 모드)
# ----------------------------------------------------------------
# 실시간 차단(Deny)을 모두 제거하여 '과탐 0'을 실현하고, AI가 분석할 로그만 생성합니다.

# SQLi/XSS/RCE 의심 패턴 (AI가 813건의 지식으로 2차 판정)
SecRule ARGS_GET|ARGS "@rx (?i)(\bunion\s+select\b|\bor\s+1=1\b|<script\b|eval\s*\(|system\s*\()" \
    "id:3100100,phase:2,pass,log,auditlog,t:none,t:urlDecodeUni,t:lowercase,\
    msg:'FOR_AI_RECLASSIFICATION',tag:'KJ_CUSTOM',tag:'KJ_AI_TARGET'"


# [Step 3] 메서드 및 오타 예외 처리 (가용성 유지)
# ----------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/api/board/posts/[0-9]+/?$" \
    "id:990130,phase:1,pass,nolog,ctl:ruleRemoveById=911100,msg:'ALLOW: BOARD_METHODS'"

SecRule REQUEST_URI_RAW "@rx (?i)(coruse|vourse|xourse|ciurse|coirse|courde|coutse|posst)" \
    "id:1000001,phase:1,pass,nolog,noauditlog,ctl:ruleRemoveById=920350"
