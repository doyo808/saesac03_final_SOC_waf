# ----------------------------------------------------------------
# AI-Generated Typo Exclusion (Run Before CRS)
# ----------------------------------------------------------------
# 1단계(phase:1)에서 오타 경로를 발견하면 920350 규칙을 제거하고, 
# 이후 모든 검사와 로그 기록을 즉시 중단(allow)합니다.

SecRule REQUEST_URI "@rx ^/lms/(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse)$" \
    "id:1000001, \
    phase:1, \
    pass, \
    allow, \
    nolog, \
    noauditlog, \
    ctl:ruleEngine=Off, \
    ctl:auditEngine=Off, \
    ctl:ruleRemoveById=920350, \
    msg:'AI-Identified Typo Filtered'"

# ----------------------------------------------------------------
# SOC Test Traffic (기존 유지)
# ----------------------------------------------------------------
SecRule REMOTE_ADDR "@ipMatch 127.0.0.1" "id:990100,phase:1,pass,log,msg:SOC_TEST_TRAFFIC_MATCHED,tag:soc-test,chain"
    SecRule REQUEST_HEADERS:X-SOC-Test "@streq CHANGE_ME_SECRET" "t:none,chain"
    SecRule REQUEST_URI "@beginsWith /soc-log-test" "t:none,ctl:ruleEngine=DetectionOnly,ctl:auditEngine=On,setvar:tx.soc_test=1"
