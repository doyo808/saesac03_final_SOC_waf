# ----------------------------------------------------------------
# AI-Generated Typo & API Call Exclusion (Final Kill Switch)
# ----------------------------------------------------------------

# [1] URI 자체에 오타 키워드가 포함된 경우 (직접 접속)
SecRule REQUEST_URI "@rx (coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse)" \
    "id:1000001, \
    phase:1, \
    pass, \
    nolog, \
    noauditlog, \
    ctl:ruleRemoveById=920350, \
    msg:'KILL_920350_BY_URI'"

# [2] 이전 페이지(Referer)에 오타 키워드가 포함된 경우 (API 호출)
# 패턴에서 lms/ 를 떼어버리고 키워드만으로 매칭하여 더 확실하게 잡습니다.
SecRule HTTP_REFERER "@rx (coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse)" \
    "id:1000002, \
    phase:1, \
    pass, \
    nolog, \
    noauditlog, \
    ctl:ruleRemoveById=920350, \
    msg:'KILL_920350_BY_REFERER'"

# [3] 아예 920350 규칙만 전역적으로 로그를 끄기 (최후의 수단)
# Host가 IP 주소인 것 자체는 공격이 아니므로 로그를 남기지 않도록 설정
SecRule REQUEST_HEADERS:Host "@rx ^[\d\.]+$" \
    "id:1000003, \
    phase:1, \
    pass, \
    nolog, \
    noauditlog, \
    ctl:ruleRemoveById=920350, \
    msg:'GLOBAL_IP_HOST_NOLOG'"
