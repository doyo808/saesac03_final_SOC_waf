# ----------------------------------------------------------------
# AI-Generated Typo & API Call Exclusion (WAF Audit Log Kill Switch)
# ----------------------------------------------------------------

# 1. 사용자가 직접 오타 경로로 접속할 때 (예: /lms/coruse)
# - 920350(IP 접속 로그) 제거 및 엔진 정지하여 로그 생성 원천 차단
SecRule REQUEST_URI "@rx ^/lms/(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse)$" \
    "id:1000001, \
    phase:1, \
    pass, \
    allow, \
    nolog, \
    noauditlog, \
    ctl:ruleEngine=Off, \
    ctl:auditEngine=Off, \
    ctl:ruleRemoveById=920350, \
    msg:'AI_EXCLUSION_URI_FINAL_SHUTDOWN'"

# 2. 오타 페이지 내에서 발생하는 모든 API 및 리소스 호출 처리 (예: /api/auth/me)
# - Referer(이전 페이지)가 오타 경로라면, 해당 요청의 920350 규칙을 제거함
# - API 응답을 위해 ruleEngine은 끄지 않고, 로그와 920350만 정지시킴
SecRule HTTP_REFERER "@rx /lms/(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse)" \
    "id:1000002, \
    phase:1, \
    pass, \
    allow, \
    nolog, \
    noauditlog, \
    ctl:auditEngine=Off, \
    ctl:ruleRemoveById=920350, \
    msg:'AI_REFERER_EXCLUSION_FINAL'"

# 3. 추가 보안: /api/ 경로에 대한 IP 접속 로그(920350) 전역 면제
# - 내부망 IP 접속 환경에서 API 로그 폭탄을 방지하기 위함
SecRule REQUEST_URI "@rx ^/api/" \
    "id:1000003, \
    phase:1, \
    pass, \
    nolog, \
    noauditlog, \
    ctl:ruleRemoveById=920350, \
    msg:'SKIP_920350_FOR_API_CALLS'"
