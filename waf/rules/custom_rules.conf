# custom rules here
# SOC test traffic: loopback + header + path DetectionOnly
SecRule REMOTE_ADDR "@ipMatch 127.0.0.1" "id:990100,phase:1,pass,log,msg:SOC_TEST_TRAFFIC_MATCHED,tag:soc-test,chain"
    SecRule REQUEST_HEADERS:X-SOC-Test "@streq CHANGE_ME_SECRET" "t:none,chain"
    SecRule REQUEST_URI "@beginsWith /soc-log-test" "t:none,ctl:ruleEngine=DetectionOnly,ctl:auditEngine=On,setvar:tx.soc_test=1"

# Log each SOC test request (for audit visibility)
SecRule TX:soc_test "@eq 1" "id:990105,phase:1,pass,log,msg:SOC_TEST_REQUEST_ACCEPTED,tag:soc-test"

# Simple representative detections (log only)
SecRule TX:soc_test "@eq 1" "id:990110,phase:2,pass,log,msg:SOC_TEST_SQLI_UNION_SELECT_DETECTED,tag:soc-test,tag:attack-sqli,chain"
    SecRule ARGS "@contains union select" "t:lowercase"

SecRule TX:soc_test "@eq 1" "id:990111,phase:2,pass,log,msg:SOC_TEST_XSS_JAVASCRIPT_DETECTED,tag:soc-test,tag:attack-xss,chain"
    SecRule ARGS "@contains javascript:" "t:lowercase"

SecRule TX:soc_test "@eq 1" "id:990112,phase:2,pass,log,msg:SOC_TEST_CMDI_WHOAMI_DETECTED,tag:soc-test,tag:attack-rce,chain"
    SecRule ARGS "@contains whoami" "t:lowercase"

SecRule TX:soc_test "@eq 1" "id:990113,phase:2,pass,log,msg:SOC_TEST_TRAVERSAL_DETECTED,tag:soc-test,tag:attack-lfi,chain"
    SecRule ARGS "@contains ../" "t:none"


