# custom rules here
# SOC test traffic: IP + header + path DetectionOnly
SecRule REMOTE_ADDR "@ipMatch 192.168.10.50" "id:990100,phase:1,pass,log,msg:'SOC test traffic matched',tag:'soc-test',chain"
    SecRule REQUEST_HEADERS:X-SOC-Test "@streq CHANGE_ME_SECRET" "t:none,chain"
    SecRule REQUEST_URI "@beginsWith /soc-log-test" "t:none,ctl:ruleEngine=DetectionOnly,ctl:auditEngine=On,setvar:tx.soc_test=1"
# Optional: uncomment only when tuning is required
# SecRule TX:soc_test "@eq 1" "id:990101,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-sqli"
# SecRule REQUEST_URI "@beginsWith /soc-log-test" "id:990102,phase:1,pass,nolog,ctl:ruleRemoveTargetById=941150;ARGS:test_input"
