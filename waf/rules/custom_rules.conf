# custom rules here
# SOC test traffic: loopback + header + path DetectionOnly
SecRule REMOTE_ADDR "@ipMatch 127.0.0.1" "id:990100,phase:1,pass,log,msg:SOC_TEST_TRAFFIC_MATCHED,tag:soc-test,chain"
    SecRule REQUEST_HEADERS:X-SOC-Test "@streq CHANGE_ME_SECRET" "t:none,chain"
    SecRule REQUEST_URI "@beginsWith /soc-log-test" "t:none,ctl:ruleEngine=DetectionOnly,ctl:auditEngine=On,setvar:tx.soc_test=1"

# Log each SOC test request (for audit visibility)
SecRule TX:soc_test "@eq 1" "id:990105,phase:1,pass,log,msg:SOC_TEST_REQUEST_ACCEPTED,tag:soc-test"

# Simple representative detections (log only)
SecRule TX:soc_test "@eq 1" "id:990110,phase:2,pass,log,msg:SOC_TEST_SQLI_UNION_SELECT_DETECTED,tag:soc-test,tag:attack-sqli,chain"
    SecRule ARGS "@contains union select" "t:lowercase"

SecRule TX:soc_test "@eq 1" "id:990111,phase:2,pass,log,msg:SOC_TEST_XSS_JAVASCRIPT_DETECTED,tag:soc-test,tag:attack-xss,chain"
    SecRule ARGS "@contains javascript:" "t:lowercase"

SecRule TX:soc_test "@eq 1" "id:990112,phase:2,pass,log,msg:SOC_TEST_CMDI_WHOAMI_DETECTED,tag:soc-test,tag:attack-rce,chain"
    SecRule ARGS "@contains whoami" "t:lowercase"

SecRule TX:soc_test "@eq 1" "id:990113,phase:2,pass,log,msg:SOC_TEST_TRAVERSAL_DETECTED,tag:soc-test,tag:attack-lfi,chain"
    SecRule ARGS "@contains ../" "t:none"



# SOC lab synthetic detection rules
SecRule REQUEST_HEADERS:X-SOC-Test "@streq true" "id:990120,phase:1,pass,log,t:lowercase,msg:SOC_SYNTHETIC_HEADER_TRUE,tag:soc-lab,tag:synthetic,severity:NOTICE,logdata:'header=%{MATCHED_VAR_NAME}:%{MATCHED_VAR}'"

SecRule ARGS "@contains SOC_SQLI_TEST" "id:990121,phase:2,pass,log,t:none,msg:SOC_SQLI_TEST,tag:soc-lab,tag:synthetic,tag:attack-sqli,severity:NOTICE,logdata:'marker=%{MATCHED_VAR}'"

SecRule ARGS "@contains SOC_XSS_TEST" "id:990122,phase:2,pass,log,t:none,msg:SOC_XSS_TEST,tag:soc-lab,tag:synthetic,tag:attack-xss,severity:NOTICE,logdata:'marker=%{MATCHED_VAR}'"

SecRule ARGS "@contains SOC_LFI_TEST" "id:990123,phase:2,pass,log,t:none,msg:SOC_LFI_TEST,tag:soc-lab,tag:synthetic,tag:attack-lfi,severity:NOTICE,logdata:'marker=%{MATCHED_VAR}'"

SecRule ARGS "@contains SOC_CMD_TEST" "id:990124,phase:2,pass,log,t:none,msg:SOC_CMD_TEST,tag:soc-lab,tag:synthetic,tag:attack-rce,severity:NOTICE,logdata:'marker=%{MATCHED_VAR}'"

# Scoped method enforcement exception for board APIs only
# Keep 911100 exceptions limited to the board endpoints below.
SecRule REQUEST_URI "@rx ^/api/board/posts/[0-9]+$" "id:990130,phase:1,pass,log,t:none,msg:SOC_ALLOW_BOARD_POST_PUT_DELETE,tag:soc-lab,tag:method-exception,chain"
    SecRule REQUEST_METHOD "@pm PUT DELETE" "t:none,ctl:ruleRemoveById=911100"

SecRule REQUEST_URI "@rx ^/api/board/posts/[0-9]+/comments/[0-9]+$" "id:990131,phase:1,pass,log,t:none,msg:SOC_ALLOW_BOARD_COMMENT_PUT_DELETE,tag:soc-lab,tag:method-exception,chain"
    SecRule REQUEST_METHOD "@pm PUT DELETE" "t:none,ctl:ruleRemoveById=911100"

SecRule REQUEST_URI "@rx ^/api/board/posts(?:/.*)?$" "id:990132,phase:1,pass,log,t:none,msg:SOC_ALLOW_BOARD_OPTIONS_PREFLIGHT,tag:soc-lab,tag:method-exception,chain"
    SecRule REQUEST_METHOD "@streq OPTIONS" "t:none,ctl:ruleRemoveById=911100"

# AI
SecRule REQUEST_URI "@rx ^/lms/(coruse|vourse|xourse|ciurse|coirse|courde|coutse|cuorse|cosure|coures|ocurse|corse|curse)$" \
    "id:1000001,phase:1,pass,nolog,noauditlog,allow,ctl:ruleRemoveById=920350,ctl:ruleEngine=Off,msg:'AI-Identified Typo & IP Access Filtered'"
