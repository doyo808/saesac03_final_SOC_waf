name: Nginx Reload

on:
  push:
    branches:
      - waf
    paths:
      - ".github/workflows/nginx-reload.yml"
      - "waf/**"
  workflow_dispatch:

jobs:
  reload:
    runs-on:
      - self-hosted
      - waf
    env:
      LIVE_REPO: /waf/saesac03_final_SOC
      LIVE_WAF_DIR: /waf/saesac03_final_SOC/waf
      BRANCH: waf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync live repository (Option 1)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${LIVE_REPO}/.git" ]; then
            echo "Live repo not found at ${LIVE_REPO}"
            exit 1
          fi
          cd "${LIVE_REPO}"
          git fetch origin "${BRANCH}"
          git reset --hard "origin/${BRANCH}"

      - name: Apply compose changes
        shell: bash
        run: |
          set -euo pipefail

          if docker info >/dev/null 2>&1; then
            USE_SUDO=0
          elif command -v sudo >/dev/null 2>&1 && sudo docker info >/dev/null 2>&1; then
            USE_SUDO=1
          else
            echo "Docker permission denied and sudo unavailable"
            exit 1
          fi

          if [ "${USE_SUDO}" -eq 0 ] && docker compose version >/dev/null 2>&1; then
            COMPOSE_KIND="plugin"
          elif [ "${USE_SUDO}" -eq 1 ] && sudo docker compose version >/dev/null 2>&1; then
            COMPOSE_KIND="plugin"
          elif command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_KIND="legacy"
          else
            echo "Neither docker compose nor docker-compose is available"
            exit 1
          fi

          run_compose() {
            if [ "${COMPOSE_KIND}" = "plugin" ]; then
              if [ "${USE_SUDO}" -eq 1 ]; then
                sudo docker compose "$@"
              else
                docker compose "$@"
              fi
            else
              if [ "${USE_SUDO}" -eq 1 ]; then
                sudo docker-compose "$@"
              else
                docker-compose "$@"
              fi
            fi
          }

          cd "${LIVE_WAF_DIR}"
          if ! run_compose up -d; then
            echo "compose up failed, recreating waf container once"
            if [ "${USE_SUDO}" -eq 1 ]; then
              sudo docker rm -f waf || true
            else
              docker rm -f waf || true
            fi
            run_compose up -d --force-recreate
          fi
      - name: Validate nginx config in container
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER_CMD="docker"
          elif command -v sudo >/dev/null 2>&1 && sudo docker info >/dev/null 2>&1; then
            DOCKER_CMD="sudo docker"
          else
            echo "Docker permission denied and sudo unavailable"
            exit 1
          fi
          ${DOCKER_CMD} exec waf nginx -t

      - name: Reload nginx in container
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER_CMD="docker"
          elif command -v sudo >/dev/null 2>&1 && sudo docker info >/dev/null 2>&1; then
            DOCKER_CMD="sudo docker"
          else
            echo "Docker permission denied and sudo unavailable"
            exit 1
          fi

          ${DOCKER_CMD} exec waf nginx -s reload || \
          ${DOCKER_CMD} exec waf sh -c 'kill -HUP 1'

      - name: Post-check logs
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER_CMD="docker"
          elif command -v sudo >/dev/null 2>&1 && sudo docker info >/dev/null 2>&1; then
            DOCKER_CMD="sudo docker"
          else
            echo "Docker permission denied and sudo unavailable"
            exit 1
          fi
          ${DOCKER_CMD} ps
          ${DOCKER_CMD} logs --tail 30 waf
