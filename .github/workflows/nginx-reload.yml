name: Nginx Reload

on:
  push:
    branches:
      - waf
    paths:
      - "waf/**"
  workflow_dispatch:

jobs:
  reload:
    runs-on:
      - self-hosted
      - waf
    env:
      LIVE_REPO: /waf/saesac03_final_SOC
      LIVE_WAF_DIR: /waf/saesac03_final_SOC/waf
      BRANCH: waf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync live repository (Option 1)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${LIVE_REPO}/.git" ]; then
            echo "Live repo not found at ${LIVE_REPO}"
            exit 1
          fi
          cd "${LIVE_REPO}"
          git fetch origin "${BRANCH}"
          git reset --hard "origin/${BRANCH}"

      - name: Apply compose changes
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v docker-compose >/dev/null 2>&1; then
            echo "docker-compose is required in this environment"
            exit 1
          fi
          COMPOSE_CMD="docker-compose"

          cd "${LIVE_WAF_DIR}"
          if docker info >/dev/null 2>&1; then
            if ! ${COMPOSE_CMD} up -d; then
              echo "compose up failed, recreating waf container once"
              docker rm -f waf || true
              ${COMPOSE_CMD} up -d --force-recreate
            fi
          elif command -v sudo >/dev/null 2>&1; then
            if ! sudo ${COMPOSE_CMD} up -d; then
              echo "compose up failed, recreating waf container once"
              sudo docker rm -f waf || true
              sudo ${COMPOSE_CMD} up -d --force-recreate
            fi
          else
            echo "Docker permission denied and sudo unavailable"
            exit 1
          fi
      - name: Validate nginx config in container
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER_CMD="docker"
          elif command -v sudo >/dev/null 2>&1; then
            DOCKER_CMD="sudo docker"
          else
            echo "Docker permission denied and sudo unavailable"
            exit 1
          fi
          ${DOCKER_CMD} exec waf nginx -t

      - name: Reload nginx in container
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER_CMD="docker"
          elif command -v sudo >/dev/null 2>&1; then
            DOCKER_CMD="sudo docker"
          else
            echo "Docker permission denied and sudo unavailable"
            exit 1
          fi

          ${DOCKER_CMD} exec waf nginx -s reload || \
          ${DOCKER_CMD} exec waf sh -c 'kill -HUP 1'

      - name: Post-check logs
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER_CMD="docker"
          else
            DOCKER_CMD="sudo docker"
          fi
          ${DOCKER_CMD} ps
          ${DOCKER_CMD} logs --tail 30 waf
