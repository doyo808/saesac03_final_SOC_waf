name: Nginx Reload Test

on:
  push:
    branches:
      - codex/waf-test
    paths:
      - "waf/**"
  workflow_dispatch:

jobs:
  reload:
    runs-on:
      - self-hosted
      - waf
    env:
      LIVE_REPO: /waf/saesac03_final_SOC
      LIVE_WAF_DIR: /waf/saesac03_final_SOC/waf
      BRANCH: codex/waf-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync live repository (Option 1)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${LIVE_REPO}/.git" ]; then
            echo "Live repo not found at ${LIVE_REPO}"
            exit 1
          fi
          cd "${LIVE_REPO}"
          git fetch origin "${BRANCH}"
          git reset --hard "origin/${BRANCH}"

      - name: Apply compose changes
        shell: bash
        run: |
          set -euo pipefail
          if command -v docker-compose >/dev/null 2>&1; then
            COMPOSE_CMD="docker-compose"
          elif docker compose version >/dev/null 2>&1; then
            COMPOSE_CMD="docker compose"
          else
            echo "Neither docker-compose nor docker compose is available"
            exit 1
          fi

          cd "${LIVE_WAF_DIR}"
          if docker info >/dev/null 2>&1; then
            ${COMPOSE_CMD} up -d
          elif command -v sudo >/dev/null 2>&1; then
            sudo ${COMPOSE_CMD} up -d
          else
            echo "Docker permission denied and sudo unavailable"
            exit 1
          fi

      - name: Validate nginx config in container
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER_CMD="docker"
          elif command -v sudo >/dev/null 2>&1; then
            DOCKER_CMD="sudo docker"
          else
            echo "Docker permission denied and sudo unavailable"
            exit 1
          fi
          ${DOCKER_CMD} exec waf nginx -t

      - name: Reload nginx in container
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER_CMD="docker"
          elif command -v sudo >/dev/null 2>&1; then
            DOCKER_CMD="sudo docker"
          else
            echo "Docker permission denied and sudo unavailable"
            exit 1
          fi

          ${DOCKER_CMD} exec waf nginx -s reload || \
          ${DOCKER_CMD} exec waf sh -c 'kill -HUP 1'

      - name: Post-check logs
        shell: bash
        run: |
          set -euo pipefail
          if docker info >/dev/null 2>&1; then
            DOCKER_CMD="docker"
          else
            DOCKER_CMD="sudo docker"
          fi
          ${DOCKER_CMD} ps
          ${DOCKER_CMD} logs --tail 30 waf
